<div class="app">
<aside class="sidebar" id="sidebar">
<header class="side-head">
<span class="side-title">资源管理器</span>
<div class="side-actions">
<button class="icon-btn" id="btnOpenDir" title="打开文件夹" aria-label="打开文件夹"><svg class="i" aria-hidden="true"><use href="#i-folder-open"></use></svg></button>
<button class="icon-btn" id="btnOpenFiles" title="打开文件" aria-label="打开文件"><svg class="i" aria-hidden="true"><use href="#i-file"></use></svg></button>
<button class="icon-btn" id="btnRefresh" title="重新扫描" aria-label="重新扫描"><svg class="i" aria-hidden="true"><use href="#i-refresh"></use></svg></button>
<button class="icon-btn" id="btnCollapse" title="折叠 / 展开全部" aria-label="折叠或展开全部"><svg class="i" aria-hidden="true"><use href="#i-collapse"></use></svg></button>
</div>
</header>
<div class="side-sub">
<span class="root-name" id="rootName">未打开</span>
<span class="mode-pill readme" id="modePill">说明</span>
<span class="file-total" id="fileTotal">0 个文件</span>
</div>
<div class="filter-box" id="filterBox">
<svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
<input id="filter" type="text" placeholder="搜索文件" autocomplete="off" spellcheck="false">
<button class="filter-clear" id="filterClear" type="button" title="清除筛选" aria-label="清除筛选"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg></button>
</div>
<nav class="tree" id="tree" role="tree" aria-label="文件"></nav>
<footer class="side-foot">
<button class="open-btn" id="btnOpenDir2" type="button"><svg class="i" aria-hidden="true"><use href="#i-folder-open"></use></svg><span>打开文件夹</span></button>
<button class="open-btn subtle" id="btnOpenFiles2" type="button"><svg class="i" aria-hidden="true"><use href="#i-file"></use></svg><span>打开文件</span></button>
<div class="side-hint" id="sideHint">拖入文件夹或文件</div>
</footer>
</aside>

<div class="resizer" id="resizer" title="拖动调整宽度"></div>

<main class="main" id="main">
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<header class="topbar">
<button class="icon-btn mobile-only" id="btnMenu" title="切换侧栏" aria-label="切换侧栏"><svg class="i" aria-hidden="true"><use href="#i-menu"></use></svg></button>
<nav class="crumbs" id="crumbs" aria-label="路径"></nav>
<div class="top-actions">
<button class="icon-btn" id="btnPrev" title="上一个文件 (Alt+←)" aria-label="上一个文件"><svg class="i" aria-hidden="true"><use href="#i-prev"></use></svg></button>
<button class="icon-btn" id="btnNext" title="下一个文件 (Alt+→)" aria-label="下一个文件"><svg class="i" aria-hidden="true"><use href="#i-next"></use></svg></button>
<select class="enc-select" id="encoding" title="文本编码" aria-label="文本编码" hidden>
<option value="auto">自动编码</option>
<option value="utf-8">UTF-8</option>
<option value="utf-16le">UTF-16 LE</option>
<option value="utf-16be">UTF-16 BE</option>
<option value="gb18030">GB18030</option>
<option value="big5">Big5</option>
<option value="shift_jis">Shift_JIS</option>
<option value="windows-1252">Windows-1252</option>
</select>
<button class="icon-btn" id="btnWrap" title="自动换行" aria-label="自动换行" hidden><svg class="i" aria-hidden="true"><use href="#i-wrap"></use></svg></button>
<button class="icon-btn" id="btnSource" title="源码 (Ctrl+E)" aria-label="源码"><svg class="i" aria-hidden="true"><use href="#i-code"></use></svg></button>
<button class="icon-btn" id="btnEdit" title="编辑文本" aria-label="编辑文本" hidden><svg class="i" aria-hidden="true"><use href="#i-edit"></use></svg></button>
<button class="icon-btn" id="btnOutline" title="大纲" aria-label="大纲"><svg class="i" aria-hidden="true"><use href="#i-list"></use></svg></button>
<button class="icon-btn" id="btnDownload" title="下载当前文件" aria-label="下载"><svg class="i" aria-hidden="true"><use href="#i-download"></use></svg></button>
<button class="icon-btn" id="btnCopyPath" title="复制路径" aria-label="复制路径"><svg class="i" aria-hidden="true"><use href="#i-copy"></use></svg></button>
<button class="icon-btn" id="btnPalette" title="快速打开 (Ctrl+P)" aria-label="快速打开"><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg></button>
<span class="sep"></span>
<button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题"><svg class="i" aria-hidden="true"><use href="#i-sun"></use></svg></button>
</div>
</header>

<div class="tabbar" id="tabbar" hidden>
<div class="tabstrip" id="tabstrip" role="tablist" aria-label="打开的文件"></div>
</div>

<div class="workspace">
<div class="content-scroll" id="scroll">
<article class="doc markdown-body" id="content" hidden></article>
<section class="welcome" id="welcome">
<div class="welcome-badge"><svg class="i" aria-hidden="true"><use href="#i-book"></use></svg></div>
<h1>SingleHtmlEditor</h1>
<p class="welcome-sub">Markdown、代码、图片、音视频、PDF、Office、EPUB<br>一个 HTML 打开尽可能多的文件</p>
<div class="welcome-actions">
<button class="btn primary" id="welcomeOpen" type="button"><svg class="i" aria-hidden="true"><use href="#i-folder-open"></use></svg>打开文件夹</button>
<button class="btn" id="welcomeFiles" type="button"><svg class="i" aria-hidden="true"><use href="#i-file"></use></svg>打开文件</button>
<button class="btn" id="welcomeSample" type="button" hidden><svg class="i" aria-hidden="true"><use href="#i-book"></use></svg>打开示例文档</button>
</div>
<div class="welcome-meta" id="welcomeMeta">正在检查最近文件夹…</div>
<div class="welcome-keys">
<div><kbd>Ctrl</kbd><kbd>P</kbd><span>快速打开</span></div>
<div><kbd>Ctrl</kbd><kbd>B</kbd><span>切换侧栏</span></div>
<div><kbd>Ctrl</kbd><kbd>E</kbd><span>源码</span></div>
<div><kbd>Esc</kbd><span>关闭浮层</span></div>
</div>
</section>
</div>
<aside class="outline" id="outline" aria-label="文档大纲">
<header class="outline-head"><span>大纲</span><button class="icon-btn" id="btnOutlineClose" title="关闭大纲" aria-label="关闭大纲"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg></button></header>
<nav class="outline-list" id="outlineList"></nav>
</aside>
</div>
</main>

<footer class="statusbar">
<div class="status-left"><span class="status-dot readme" id="statusDot"></span><span id="statusMode">说明 · 0 个文件</span></div>
<div class="status-path" id="statusPath">未打开文件</div>
<div class="status-right"><span id="statusInfo"></span><span class="sep"></span><span id="statusStats"></span></div>
</footer>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="快速打开文件">
<div class="palette-box">
<div class="palette-input-wrap"><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg><input id="paletteInput" type="text" placeholder="按文件名或路径搜索…" autocomplete="off" spellcheck="false"></div>
<div class="palette-list" id="paletteList"></div>
<div class="palette-foot"><span><b>↑ ↓</b> 选择</span><span><b>Enter</b> 预览</span><span><b>Ctrl+Enter</b> 固定</span><span><b>Esc</b> 关闭</span></div>
</div>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
<button class="lb-close" id="lbClose" title="关闭" aria-label="关闭"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg></button>
<img id="lightboxImg" alt="">
<div class="lb-caption" id="lbCaption"></div>
</div>
<div class="drop-overlay" id="dropOverlay"><div class="drop-card"><svg class="i" aria-hidden="true"><use href="#i-folder-open"></use></svg><strong>松开以打开</strong><span>文件夹或文件都可以</span></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileInput" multiple hidden>

<script type="text/markdown" id="readme-data"># SingleHtmlEditor

SingleHtmlEditor 是一个可离线使用的单文件阅读器。打开本地文件夹后，可浏览 Markdown、代码、图片、音视频、PDF、Office、EPUB 等常见文件，并支持文本编辑写回。

## 开始使用

- 点击「打开文件夹」，选择要阅读的目录；Chrome / Edge 会请求一次读取权限。
- 也可以把文件夹或文件直接拖入窗口。
- 单击文件会在顶部的斜体预览标签中打开，再次单击其他文件会复用该标签；双击文件可固定标签。
- 标签可切换和关闭；进入编辑模式会自动固定当前标签；关闭最后一个文件后回到欢迎页。
- 切换标签会保留该标签的未保存草稿、编辑位置和视图设置；有草稿的标签显示圆点。
- 关闭含未保存修改的标签、切换文件夹前会先确认；草稿只保存在当前页面内存中，刷新后不会恢复。
- 未保存草稿总文本上限为 20M 字符，超过时需先保存或取消部分标签的修改。
- 文件只在当前浏览器本地读取，不会上传，也不需要联网。
- 编辑文本时按 `Ctrl+S` 保存，写回原文件前会再请求写入权限。

## 最近文件夹

<div class="recent-panel" id="recent-panel"></div>

在支持目录句柄的浏览器（Chrome / Edge）中，本页会记住最近打开的 5 个文件夹名称和目录句柄。句柄保存在浏览器 IndexedDB 中，不记录绝对路径。

- 启动时会自动检查最近一次目录的授权状态。
- 权限仍然有效时，直接恢复到该文件夹。
- 权限需要重新确认时，停留在本说明页，并显示恢复列表；点击「恢复」一次即可重新授权。
- 浏览器不允许页面在启动时自动弹出文件系统授权框，因此首次恢复必须由用户点击触发。
- Firefox / Safari 等不支持目录句柄的浏览器仍可通过「打开文件夹」载入文件，但不保存最近目录。

## 快捷键

| 快捷键 | 功能 |
| --- | --- |
| `Ctrl+P` | 快速打开文件（`Enter` 预览，`Ctrl+Enter` 固定） |
| `Ctrl+B` | 切换侧栏 |
| `Ctrl+E` | Markdown 源码 |
| `Ctrl+S` | 保存编辑 |
| `Alt+←` / `Alt+→` | 上一个 / 下一个文件 |
| `Esc` | 关闭浮层或退出编辑 |

## 离线说明

页面本身、README 和阅读功能均可离线使用。最近文件夹的权限确认是浏览器本地行为，不需要网络连接。

> 如果清除了站点数据，最近文件夹记录会一并删除；此时重新打开文件夹即可重新建立记录。

<script>
(function () {
  function bytes(s) {
    var b = atob(String(s || '').replace(/\s+/g, ''));
    var u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function inflate(s) {
    var stream = new Blob([bytes(s)]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }
  (async function () {
    try {
      document.getElementById('she-style').textContent = await inflate(document.getElementById('she-css').textContent);
      var code = await inflate(document.getElementById('she-js').textContent);
      var tag = document.createElement('script');
      tag.textContent = code;
      document.body.appendChild(tag);
      document.body.style.visibility = 'visible';
    } catch (err) {
      document.body.style.visibility = 'visible';
      var box = document.createElement('pre');
      box.style.cssText = 'max-width:720px;margin:12vh auto;padding:20px;border:1px solid #c33;border-radius:8px;color:#f48771;background:#2b1d1d;white-space:pre-wrap;font:13px/1.6 monospace';
      box.textContent = '启动失败：' + (err && err.message ? err.message : err) + '\n请使用最新版 Chrome / Edge / Firefox / Safari 打开。';
      document.body.appendChild(box);
    }
  })();
})();
</script>
